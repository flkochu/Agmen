# robot.toml — todo el robot del tutorial con UN solo comando:
#
#   agmen run examples/tutorial/robot.toml
#
# Las rutas son relativas a este archivo. "python" se reemplaza por el mismo
# Python que corre agmen (funciona igual en Windows y Linux).
#
# Desde Agmen 0.5 los nodos se hablan por TOPICS ("/imu", "/cmd"): nadie
# escribe IPs ni puertos. `agmen run` arranca solo el `agmen hub`, el
# directorio donde cada nodo se anota (capítulo 9).

[robot]
name = "robot del tutorial"
# Antes de arrancar los nodos: compilar (si ya está compilado, tarda 1 s).
before = ["cmake --build ../../build --config Release"]

[[node]]
name = "imu"                                   # el sensor del capítulo 1
cmd = "../../build/bin/publisher --rate 100 --to /imu"
restart = "on-failure"                         # si se cae, se vuelve a levantar solo

[[node]]
name = "motor"                                 # el motor con freno de seguridad (capítulo 2)
cmd = "../../build/bin/tutorial_motor --escuchar /cmd"
restart = "on-failure"

[[node]]
name = "cerebro"                               # la "IA" en Python (capítulo 3)
cmd = "python cerebro.py --destino /cmd/cerebro"   # le habla al mux, no directo al motor
autostart = false                              # empieza apagado: lo prendes desde el panel

# ¿Quién manda al motor? (capítulo 6). Cerebro y panel publican cada uno en su
# topic; el mux pasa a /cmd solo al de prioridad más alta que esté hablando.
# Si sueltas el teclado, en 0.3 s el mando regresa al cerebro.
[[mux]]
name = "ruedas"
output = "/cmd"                                # lo que escucha el motor
hold_ms = 300

[[mux.input]]
name = "teleop"                                # tú, desde el panel: manda más
topic = "/cmd/teleop"
priority = 10

[[mux.input]]
name = "cerebro"                               # el modo autónomo
topic = "/cmd/cerebro"
priority = 1

# Los topics que esperas (opcional). El hub te avisa si alguien publica uno
# que no está aquí ("¿Quisiste decir '/imu'?"), si llega con otro tipo, o si
# uno obligatorio se queda sin nadie que lo publique.
[[topic]]
name = "/imu"
type = "ImuSample"
required = true

[[topic]]
name = "/cmd"
type = "MotorCommand"

[[topic]]
name = "/cmd/teleop"
type = "MotorCommand"

[[topic]]
name = "/cmd/cerebro"
type = "MotorCommand"

[web]
http = "127.0.0.1:8080"                        # usa "0.0.0.0:8080" para abrirlo desde el celular
listen = "127.0.0.1:7400"                      # además de los topics: para nodos sin hub (ej. un ESP32)

[web.teleop]
target = "/cmd/teleop"                         # tus teclas W A S D van a la entrada "teleop" del mux
max_speed = 1.0
