# robot.toml — todo el robot del tutorial con UN solo comando:
#
#   agmen run examples/tutorial/robot.toml
#
# Las rutas son relativas a este archivo. "python" se reemplaza por el mismo
# Python que corre agmen (funciona igual en Windows, Linux y macOS).

[robot]
name = "robot del tutorial"
# Antes de arrancar los nodos: compilar (si ya está compilado, tarda 1 s).
before = ["cmake --build ../../build --config Release"]

[[node]]
name = "imu"                                   # el sensor del capítulo 1
cmd = "../../build/bin/publisher --rate 100"   # manda ImuSample al panel (127.0.0.1:7400)
restart = "on-failure"                         # si se cae, se vuelve a levantar solo

[[node]]
name = "motor"                                 # el motor con freno de seguridad (capítulo 2)
cmd = "../../build/bin/tutorial_motor"
restart = "on-failure"

[[node]]
name = "cerebro"                               # la "IA" en Python (capítulo 3)
cmd = "python cerebro.py --destino 127.0.0.1:7511"   # le habla al mux, no directo al motor
autostart = false                              # empieza apagado: lo prendes desde el panel

# ¿Quién manda al motor? (capítulo 6). Cerebro y panel le hablan al mux, cada
# uno por su puerto; el mux reenvía al motor solo al de prioridad más alta que
# esté hablando. Si sueltas el teclado, en 0.3 s el mando regresa al cerebro.
[[mux]]
name = "ruedas"
output = "127.0.0.1:7500"                      # el motor
hold_ms = 300

[[mux.input]]
name = "teleop"                                # tú, desde el panel: manda más
listen = "127.0.0.1:7510"
priority = 10

[[mux.input]]
name = "cerebro"                               # el modo autónomo
listen = "127.0.0.1:7511"
priority = 1

[web]
http = "127.0.0.1:8080"                        # usa "0.0.0.0:8080" para abrirlo desde el celular
listen = "127.0.0.1:7400"                      # aquí llegan los datos que se grafican

[web.teleop]
target = "127.0.0.1:7510"                      # la entrada "teleop" del mux (que reenvía al motor)
max_speed = 1.0
