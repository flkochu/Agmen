# Compila y prueba en Windows (MSVC), Linux (GCC) y Linux ARM64 (el mismo
# procesador que una Raspberry Pi 3/4/5 con sistema de 64 bits) en cada push y
# pull request. Si algo deja de funcionar en un sistema, GitHub te avisa.
# macOS no tiene soporte oficial desde 0.11.1 (docs/VISION.md, §4): el código
# sigue siendo POSIX, pero ya no se prueba aquí.
name: CI

on:
  push:
    branches: ["**"]   # los tags los maneja release.yml
  pull_request:
  workflow_call:      # release.yml reutiliza estas pruebas

jobs:
  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        id: py
        with:
          python-version: "3.12"

      - name: Versión consistente
        run: python scripts/check_version.py

      - name: nanobind (para agmen._core), NumPy, pyarrow (el juez de arrow), mcap (el juez de las grabaciones) y MuJoCo (el mundo)
        run: python -m pip install nanobind numpy pyarrow mcap mujoco

      - name: OpenGL por software (la cámara del mundo de MuJoCo, solo x86-64)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libosmesa6

      - name: include/agmen/msgs.hpp al día con python/agmen/msgs.agmen
        run: python -m agmen gen python/agmen/msgs.agmen --cpp include/agmen --check-files
        env:
          PYTHONPATH: python

      - name: Configurar (advertencias = errores)
        run: cmake -S . -B build -DAGMEN_WERROR=ON -DCMAKE_BUILD_TYPE=Release -DPython_EXECUTABLE="${{ steps.py.outputs.python-path }}"

      - name: Compilar
        run: cmake --build build --config Release --parallel

      - name: Pruebas de C++
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Pruebas de Python (con el núcleo de C++)
        env:
          AGMEN_BACKEND: native
        run: python -m unittest discover -s python -v

      - name: Pruebas de Python (Python puro, las mismas)
        env:
          AGMEN_BACKEND: pure
        run: python -m unittest discover -s python

      - name: Python con núcleo de C++ contra Python puro, medido
        run: python scripts/py_bench.py

      - name: Interoperabilidad C++ <-> Python
        run: python scripts/interop.py

      - name: Interfaz web (WebSocket, costo del puente, Foxglove)
        run: python scripts/web_smoke.py

      - name: Compatible con el cliente oficial de Foxglove
        if: matrix.os == 'ubuntu-latest'
        run: python scripts/foxglove_check.py --required

      - name: Tutorial (el código del tutorial funciona)
        run: python scripts/tutorial_check.py

      - name: agmen run (un comando para todo el robot + panel + prioridad)
        run: python scripts/run_smoke.py

      - name: Grabar y reproducir (agmen run --record, agmen info, agmen run --play)
        run: python scripts/grabar_smoke.py

      - name: Perfiles (agmen run --sim, --profile, --play con perfil replay)
        run: python scripts/perfiles_smoke.py

      - name: Mundo de MuJoCo (agmen run --sim con el robot del tutorial; la cámara es obligatoria solo en ubuntu-latest)
        run: python scripts/sim_smoke.py --required ${{ matrix.os == 'ubuntu-latest' && '--camara-requerida' || '' }}

      - name: ¿Paralelo o en serie? (nodos, terminal, apagado, panel y grupos de un Node)
        run: python scripts/paralelo_check.py

      - name: Topics y hub (C++ <-> Python, topic list/echo/hz, un topic un tipo)
        run: python scripts/topics_smoke.py

      - name: Mensajes .agmen (C++ generado <-> Python con agmen.load)
        run: python scripts/gen_smoke.py

      - name: Node y reloj de Agmen (sim ×2, pausa desde el panel, simulador paso a paso)
        run: python scripts/node_check.py

      - name: Instalar el paquete (compila agmen._core) y probarlo
        run: |
          python -m pip install .
          agmen --version
          python scripts/wheel_check.py

  sanitizers:
    name: ubuntu + ASan/UBSan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Compilar con sanitizers
        run: |
          cmake -S . -B build -DAGMEN_WERROR=ON -DAGMEN_SANITIZE=ON -DCMAKE_BUILD_TYPE=Debug
          cmake --build build --parallel
      - name: Pruebas
        run: ctest --test-dir build --output-on-failure

  # El cierre del núcleo de C++ (atexit, python/test_cierre.py) también con Python 3.13: ahí CPython
  # no aborta al finalizar con hilos vivos, pero las pruebas deterministas del cierre deben seguir
  # cumpliéndose. Los otros jobs corren con 3.12, donde el aborto sí muerde.
  cierre-313:
    name: ubuntu + Python 3.13 (cierre del núcleo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        id: py
        with:
          python-version: "3.13"

      - name: nanobind (para agmen._core) y NumPy
        run: python -m pip install nanobind numpy

      - name: Configurar y compilar agmen._core (advertencias = errores)
        run: |
          cmake -S . -B build -DAGMEN_WERROR=ON -DCMAKE_BUILD_TYPE=Release -DPython_EXECUTABLE="${{ steps.py.outputs.python-path }}"
          cmake --build build --config Release --parallel

      - name: Pruebas del cierre (con el núcleo de C++)
        env:
          AGMEN_BACKEND: native
        run: python -m unittest discover -s python -p "test_cierre.py" -v

  # Fuzzing corto del decodificador (tests/fuzz/README.md): cada fuzzer parte de
  # los vectores de prueba y de las regresiones guardadas, y corre un minuto con
  # ASan y UBSan. Si encuentra algo, la entrada queda en los artefactos del job.
  fuzz:
    name: ubuntu + fuzzing (libFuzzer y atheris)
    runs-on: ubuntu-24.04
    env:
      CXX: clang++-18
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: libFuzzer (viene con Clang; si falta, se instala)
        run: |
          echo 'extern "C" int LLVMFuzzerTestOneInput(const char*, unsigned long) { return 0; }' > /tmp/f.cpp
          if ! $CXX -fsanitize=fuzzer /tmp/f.cpp -o /tmp/f; then
            sudo apt-get update && sudo apt-get install -y clang-18 libclang-rt-18-dev
          fi

      - name: Compilar los fuzzers (Clang, ASan + UBSan)
        run: |
          cmake -S . -B build-fuzz -DAGMEN_FUZZ=ON -DAGMEN_WERROR=ON -DCMAKE_BUILD_TYPE=RelWithDebInfo -DAGMEN_BUILD_EXAMPLES=OFF
          cmake --build build-fuzz --parallel

      - name: Regresiones y pruebas del formato, con ASan y UBSan
        run: ctest --test-dir build-fuzz --output-on-failure -R "fuzz_regresiones|wire|layout|arrow"

      - name: Corpus inicial (tests/vectors y tests/fuzz/regresiones)
        run: |
          python tests/fuzz/semillas.py build-fuzz/corpus
          for t in wire layout arrow; do
            cp tests/fuzz/regresiones/$t/* build-fuzz/corpus/$t/
            mkdir -p build-fuzz/corpus-py/$t && cp build-fuzz/corpus/$t/* build-fuzz/corpus-py/$t/
          done
          mkdir -p build-fuzz/fallas

      - name: libFuzzer, 60 s por fuzzer
        run: |
          for t in wire layout arrow; do
            echo "::group::fuzz_$t"
            build-fuzz/bin/fuzz_$t build-fuzz/corpus/$t -max_total_time=60 -max_len=16384 -timeout=10 \
              -rss_limit_mb=2048 -dict=tests/fuzz/esquemas.dict -artifact_prefix=build-fuzz/fallas/$t- -print_final_stats=1
            echo "::endgroup::"
          done

      - name: atheris (Python puro), 30 s por blanco
        run: |
          python -m pip install atheris
          for t in wire layout arrow; do
            echo "::group::python $t"
            python tests/fuzz/fuzz_python.py $t build-fuzz/corpus-py/$t -max_total_time=30 -max_len=16384 -timeout=10 \
              -rss_limit_mb=2048 -dict=tests/fuzz/esquemas.dict -artifact_prefix=build-fuzz/fallas/python-$t-
            echo "::endgroup::"
          done

      - name: Guardar lo que encontraron los fuzzers
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: fuzz-fallas
          path: build-fuzz/fallas/
          if-no-files-found: ignore
