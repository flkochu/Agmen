# Publica una versión nueva cuando haces push de un tag vX.Y.Z:
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# 1. Verifica que el tag coincida con VERSION, Python y CHANGELOG.
# 2. Corre todas las pruebas en Windows y Linux (x86-64 y ARM64).
# 3. Construye las wheels compiladas (3 sistemas, cibuildwheel), la de Python
#    puro y el sdist, las prueba instaladas y las sube a PyPI (pip install agmen).
#    En macOS (sin soporte oficial desde 0.11.1) pip instala la de Python puro.
# 4. Crea el Release en GitHub con los archivos.
#
# Usa "Trusted Publishing" de PyPI: no hay contraseñas ni tokens guardados.
# Configuración única: docs/PUBLICAR.md.
name: Release

on:
  push:
    tags: ["v*.*.*"]

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Versión consistente con el tag
        run: python scripts/check_version.py "${{ github.ref_name }}"

  pruebas:
    needs: verificar
    uses: ./.github/workflows/ci.yml

  # Wheels compiladas (agmen._core) para cada sistema, con cibuildwheel. Cada
  # una se instala y se prueba (scripts/wheel_check.py) antes de subirla.
  wheels:
    needs: pruebas
    name: wheels ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Construir y probar las wheels
        run: |
          python -m pip install "cibuildwheel>=4,<5"
          python -m cibuildwheel --output-dir wheelhouse
      - uses: actions/upload-artifact@v6
        with:
          name: dist-${{ matrix.os }}
          path: wheelhouse/*.whl

  # La wheel de Python puro (cualquier computadora sin wheel compilada) y el sdist.
  puro:
    needs: pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Construir
        run: |
          python -m pip install --upgrade build
          AGMEN_PURE=1 python -m build --wheel
          python -m build --sdist
      - name: Probar la wheel de Python puro
        run: |
          python -m venv /tmp/puro
          /tmp/puro/bin/pip install dist/*-py3-none-any.whl
          /tmp/puro/bin/python scripts/wheel_check.py --pure
      - uses: actions/upload-artifact@v6
        with:
          name: dist-puro
          path: dist/

  pypi:
    needs: [wheels, puro]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/agmen/
    permissions:
      id-token: write   # necesario para Trusted Publishing
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist/
      - name: Crear Release con las notas del CHANGELOG
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > notas.md
          gh release create "$GITHUB_REF_NAME" dist/* --title "Agmen $VERSION" --notes-file notas.md
