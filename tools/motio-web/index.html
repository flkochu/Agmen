<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Motio · interfaz web</title>
<style>
  :root {
    --bg: #0f1216; --panel: #171b21; --line: #262c35; --text: #e6e9ee; --muted: #8b95a3;
    --x: #ef5a5a; --y: #4cc38a; --z: #4f8ff7; --ok: #4cc38a; --warn: #e9b949; --bad: #ef5a5a;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f5f6f8; --panel: #ffffff; --line: #e3e6eb; --text: #1b1f24; --muted: #66707d; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { display: flex; align-items: center; gap: 12px; padding: 14px 20px;
           border-bottom: 1px solid var(--line); }
  .logo { font-weight: 700; letter-spacing: .02em; font-size: 16px; }
  .logo span { color: var(--muted); font-weight: 400; }
  .pill { margin-left: auto; display: inline-flex; align-items: center; gap: 8px; padding: 4px 10px;
          border: 1px solid var(--line); border-radius: 999px; font-size: 12px; color: var(--muted); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .dot.ok { background: var(--ok); } .dot.warn { background: var(--warn); } .dot.bad { background: var(--bad); }
  main { padding: 20px; display: grid; gap: 16px; max-width: 1200px; margin: 0 auto; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
  .card .k { color: var(--muted); font-size: 12px; }
  .card .v { font: 600 22px/1.3 var(--mono); margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .v.small { font-size: 14px; padding-top: 6px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
  .panel h2 { margin: 0 0 8px; font-size: 13px; font-weight: 600; display: flex; gap: 14px; align-items: center; }
  .panel h2 .unit { color: var(--muted); font-weight: 400; }
  .legend { margin-left: auto; display: flex; gap: 12px; font-weight: 400; color: var(--muted); font-size: 12px; }
  .legend i { display: inline-block; width: 10px; height: 3px; border-radius: 2px; margin-right: 5px; vertical-align: middle; }
  canvas { width: 100%; height: 220px; display: block; }
  .error { display: none; border-color: color-mix(in srgb, var(--bad) 50%, var(--line));
           font: 12px/1.5 var(--mono); color: var(--bad); }
  footer { color: var(--muted); font-size: 12px; text-align: center; padding: 8px 0 24px; }
  code { font-family: var(--mono); }
</style>
</head>
<body>
<header>
  <div class="logo">Motio <span>· interfaz web (prototipo)</span></div>
  <div class="pill"><span class="dot" id="dot"></span><span id="status">conectando…</span></div>
</header>

<main>
  <section class="cards">
    <div class="card"><div class="k">Frecuencia</div><div class="v" id="rate">—</div></div>
    <div class="card"><div class="k">Latencia (misma máquina)</div><div class="v" id="lat">—</div></div>
    <div class="card"><div class="k">Perdidos</div><div class="v" id="lost">—</div></div>
    <div class="card"><div class="k">Errores</div><div class="v" id="errors">—</div></div>
    <div class="card"><div class="k">Tipo · origen</div><div class="v small" id="source">—</div></div>
  </section>

  <section class="panel">
    <h2>Acelerómetro <span class="unit">m/s²</span>
      <span class="legend"><span><i style="background:var(--x)"></i>x</span><span><i style="background:var(--y)"></i>y</span><span><i style="background:var(--z)"></i>z</span></span>
    </h2>
    <canvas id="accel"></canvas>
  </section>

  <section class="panel">
    <h2>Giroscopio <span class="unit">rad/s</span>
      <span class="legend"><span><i style="background:var(--x)"></i>x</span><span><i style="background:var(--y)"></i>y</span><span><i style="background:var(--z)"></i>z</span></span>
    </h2>
    <canvas id="gyro"></canvas>
  </section>

  <section class="panel error" id="errbox"></section>
</main>

<footer>
  Todo el dibujo ocurre en este navegador. El robot solo publica mensajes Motio;
  el puente (<code>tools/motio-web/bridge.py</code>) los reenvía.
</footer>

<script>
"use strict";
const WINDOW_S = 10;          // segundos visibles en las gráficas
const buf = [];               // {t, accel:[3], gyro:[3]}
let lastData = 0;

const $ = (id) => document.getElementById(id);
const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();

function setStatus(kind, text) {
  $("dot").className = "dot " + kind;
  $("status").textContent = text;
}

function updateStats(s) {
  $("rate").textContent = s.rate_hz ? s.rate_hz.toFixed(0) + " Hz" : "0 Hz";
  $("lat").textContent = s.latency_ms == null ? "—" : s.latency_ms.toFixed(2) + " ms";
  $("lost").textContent = s.lost;
  $("errors").textContent = s.errors;
  $("source").textContent = s.type ? `${s.type} · ${s.source}` : `esperando en ${s.listening}`;
  const box = $("errbox");
  box.style.display = s.last_error ? "block" : "none";
  box.textContent = s.last_error ? "Último error: " + s.last_error : "";
}

// Gráfica de líneas en <canvas>, sin librerías (funciona sin internet).
function draw(canvas, key) {
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.clientWidth, h = canvas.clientHeight;
  if (canvas.width !== w * dpr || canvas.height !== h * dpr) {
    canvas.width = w * dpr; canvas.height = h * dpr;
  }
  const ctx = canvas.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);

  const padL = 48, padR = 8, padT = 8, padB = 22;
  const pw = w - padL - padR, ph = h - padT - padB;
  const tEnd = buf.length ? buf[buf.length - 1].t : 0, tStart = tEnd - WINDOW_S;

  let lo = Infinity, hi = -Infinity;
  for (const s of buf) for (const v of s[key]) { if (v < lo) lo = v; if (v > hi) hi = v; }
  if (!isFinite(lo)) { lo = -1; hi = 1; }
  const span = Math.max(hi - lo, 0.5), mid = (hi + lo) / 2;
  lo = mid - span * 0.6; hi = mid + span * 0.6;

  const X = (t) => padL + ((t - tStart) / WINDOW_S) * pw;
  const Y = (v) => padT + (1 - (v - lo) / (hi - lo)) * ph;

  // cuadrícula y etiquetas
  ctx.strokeStyle = css("--line"); ctx.fillStyle = css("--muted");
  ctx.lineWidth = 1; ctx.font = "11px " + css("--mono");
  ctx.textAlign = "right"; ctx.textBaseline = "middle";
  for (let i = 0; i <= 4; i++) {
    const v = lo + (hi - lo) * i / 4, y = Y(v);
    ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(w - padR, y); ctx.stroke();
    ctx.fillText(v.toFixed(2), padL - 6, y);
  }
  ctx.textBaseline = "top";
  for (let s = 0; s <= WINDOW_S; s += 2) {
    ctx.textAlign = s === 0 ? "left" : s === WINDOW_S ? "right" : "center";
    ctx.fillText(s === WINDOW_S ? "ahora" : `-${WINDOW_S - s}s`, X(tStart + s), h - padB + 6);
  }

  // series x, y, z
  ["--x", "--y", "--z"].forEach((color, axis) => {
    ctx.strokeStyle = css(color); ctx.lineWidth = 1.6; ctx.beginPath();
    let started = false;
    for (const s of buf) {
      if (s.t < tStart) continue;
      const px = X(s.t), py = Y(s[key][axis]);
      if (!started) { ctx.moveTo(px, py); started = true; } else ctx.lineTo(px, py);
    }
    ctx.stroke();
  });
}

function frame() {
  draw($("accel"), "accel");
  draw($("gyro"), "gyro");
  if (lastData && performance.now() - lastData > 1500) setStatus("warn", "conectado · sin datos del robot");
  requestAnimationFrame(frame);
}

function connect() {
  const es = new EventSource("/api/stream");
  es.onopen = () => setStatus("warn", "conectado · esperando datos");
  es.onerror = () => setStatus("bad", "sin conexión con el puente · reintentando…");
  es.onmessage = (ev) => {
    const msg = JSON.parse(ev.data);
    if (msg.samples.length) {
      for (const s of msg.samples) buf.push(s);
      const tEnd = buf[buf.length - 1].t;
      while (buf.length && buf[0].t < tEnd - WINDOW_S - 1) buf.shift();
      lastData = performance.now();
      setStatus("ok", "recibiendo datos");
    }
    updateStats(msg.stats);
  };
}

connect();
requestAnimationFrame(frame);
</script>
</body>
</html>
